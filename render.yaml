services:
  - type: web
    name: home-task-service
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: TZ
        value: America/Sao_Paulo
      - key: DATABASE_URL
        sync: false        # set manually to your Neon/Supabase connection string
      - key: FRONTEND_URL
        sync: false        # e.g. https://your-app.vercel.app
      - key: CHILD1_NAME
        sync: false
      - key: CHILD2_NAME
        sync: false
      # Optional — WhatsApp deadline reminders via Twilio (leave unset to disable)
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WA_FROM
        sync: false
      - key: WHATSAPP_CHILD1
        sync: false
      - key: WHATSAPP_CHILD2
        sync: false
      - key: WHATSAPP_PARENTS
        sync: false
      # Optional: protects POST /api/cron/* (unset = those endpoints answer 503)
      - key: CRON_TOKEN
        sync: false
      # Push notifications to the children's phones: generate once with ./gradlew generateVapidKeys
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false        # e.g. mailto:you@example.com
