# ── Production (Railway) ──────────────────────────────────────────────────────
# Railway provides DATABASE_URL in the format:
#   postgresql://user:pass@host:5432/dbname
# The DatabaseConfig bean below converts it to jdbc: format automatically.
# We still declare these so Spring Boot's health checks work.

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${PGUSER:}
spring.datasource.password=${PGPASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Flyway owns the schema (db/migration); Hibernate no longer inspects it at boot.
# baseline-version=0: on the database that predates Flyway, V1 (idempotent) still runs.
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.h2.console.enabled=false

server.address=0.0.0.0

